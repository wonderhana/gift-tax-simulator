*{box-sizing:border-box}
body{margin:0; min-height:100vh; background:#161C2E; color:#E8EAEF;
  font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  display:flex; align-items:center; justify-content:center; padding:24px}
.gate{width:100%; max-width:380px; text-align:center}
.logo{width:64px; height:64px; border-radius:14px; margin-bottom:14px}
.firm{font-size:17px; font-weight:700; color:#FFFFFF}
.tag{font-size:10.5px; letter-spacing:.18em; color:#B89D78; font-weight:500; margin-bottom:26px}

form{display:flex; gap:8px}
input{flex:1; min-width:0; font:inherit; font-size:16px; letter-spacing:.2em; text-align:center;
  background:#1E2537; color:#FFFFFF; border:1.5px solid #333B52; border-radius:10px; padding:12px}
input::placeholder{letter-spacing:0; font-size:13.5px; color:#6B7488}
input:focus-visible{outline:2px solid #B89D78; outline-offset:1px; border-color:#B89D78}
button{font:inherit; font-size:14.5px; font-weight:700; cursor:pointer; white-space:nowrap;
  background:#B89D78; color:#161C2E; border:none; border-radius:10px; padding:12px 20px}
button:hover{filter:brightness(1.08)}
button:disabled{opacity:.55; cursor:wait}
#err{font-size:13px; color:#E66767; margin-top:14px}
.foot{margin-top:34px; font-size:11.5px; color:#6B7488}
[hidden]{display:none!important}
</style>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw){
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    {name:'PBKDF2', salt:b64(D.s), iterations:310000, hash:'SHA-256'},
    km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(D.i)}, key, b64(D.c));
  return new TextDecoder().decode(pt);
}
async function attempt(pw, silent){
  const btn = document.getElementById('btn'), err = document.getElementById('err');
  btn.disabled = true; err.hidden = true;
  try{
    const html = await unlock(pw);
    try{ sessionStorage.setItem('consultPw', pw); }catch(e){}
    document.open(); document.write(html); document.close();
  }catch(e){
    btn.disabled = false;
    if(!silent){ err.hidden = false; document.getElementById('pw').select(); }
  }
}
document.getElementById('f').addEventListener('submit', ev => {
  ev.preventDefault();
  const pw = document.getElementById('pw').value.trim();
  if(pw) attempt(pw, false);
});
try{
  const saved = sessionStorage.getItem('consultPw');
  if(saved) attempt(saved, true);
}catch(e){}
